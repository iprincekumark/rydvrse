name: CI Backend

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rydvrse-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: rydvrse-server/pom.xml

      - name: Run tests
        run: mvn -B clean test
