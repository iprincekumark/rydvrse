services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rydvrse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rydvrse
      POSTGRES_USER: rydvrse
      POSTGRES_PASSWORD: rydvrse_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rydvrse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
