version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: rydvrse-postgres
    environment:
      POSTGRES_DB: rydvrse
      POSTGRES_USER: rydvrse
      POSTGRES_PASSWORD: rydvrse_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rydvrse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rydvrse-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
