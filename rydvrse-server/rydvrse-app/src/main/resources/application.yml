server:
  port: 8080

spring:
  application:
    name: rydvrse-server
  profiles:
    active: dev

  # Database — PostGIS
  datasource:
    url: jdbc:postgresql://localhost:5432/rydvrse
    username: rydvrse
    password: rydvrse_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    show-sql: false
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# RYDVRSE Config
rydvrse:
  jwt:
    secret: rydvrse-super-secret-jwt-key-must-be-at-least-256-bits-long-12345
    access-token-expiration-ms: 900000         # 15 minutes
    refresh-token-expiration-ms: 2592000000    # 30 days
  otp:
    expiration-seconds: 300                     # 5 minutes
    dev-bypass-enabled: true                    # Accept 123456 as OTP for any number (LOCAL DEV ONLY)

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.rydvrse: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.security: INFO
