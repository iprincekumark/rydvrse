# ============================================================
# RYDVRSE Platform — Application Configuration
# ============================================================
# All secrets read from environment variables (.env file).
# See .env.example for the full list.
# ============================================================

spring:
  application:
    name: ${APP_NAME:rydvrse-platform}

  # ---- PostgreSQL ----
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rydvrse}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:rydvrse}
    password: ${DB_PASSWORD:rydvrse_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_SIZE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000}ms

  # ---- Kafka ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_GROUP_ID:rydvrse-platform}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ---- Server ----
server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${APP_CONTEXT_PATH:/api}

# ---- RYDVRSE Custom Config ----
rydvrse:
  jwt:
    secret: ${JWT_SECRET:rydvrse-jwt-secret-key-change-in-production-must-be-256-bits-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${JWT_ISSUER:rydvrse.com}
  otp:
    expiration-seconds: 300
    length: ${OTP_LENGTH:6}
  dispatch:
    search-radius-km: ${DISPATCH_SEARCH_RADIUS_KM:10.0}
    max-retries: ${DISPATCH_MAX_RETRIES:3}
    timeout-seconds: ${DISPATCH_TIMEOUT_SECONDS:30}
  pricing:
    base-fare: ${PRICING_DEFAULT_BASE_FARE:50.0}
    per-km-rate: ${PRICING_DEFAULT_PER_KM:12.0}
    per-minute-rate: ${PRICING_DEFAULT_PER_MIN:2.0}
    minimum-fare: ${PRICING_MINIMUM_FARE:80.0}
    surge-multiplier-cap: ${PRICING_SURGE_MULTIPLIER_CAP:3.0}
  payment:
    commission-pct: ${PLATFORM_COMMISSION_PCT:20.0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---- Custom App Info (for Swagger) ----
app:
  version: ${SWAGGER_VERSION:1.0.0}

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${APP_NAME:rydvrse-platform}

# ---- Logging ----
logging:
  level:
    com.rydvrse: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# ---- Springdoc / Swagger ----
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    filter: true
